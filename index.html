<style>
:root{
  /* Layout : en-tête + onglets, barre d'outils, puis la vue (cartes sur mobile, grilles sur ordinateur) */
  --paper:#f2f3f0;--surface:#ffffff;--ink:#1b2326;--muted:#5b666b;--line:#dde1dc;
  --accent:#e2550f;--accent-ink:#ffffff;--ok:#23824f;--warn:#a86a0c;--bad:#c53b33;--today:rgba(226,85,15,.07);
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#131819;--surface:#1b2225;--ink:#e7ebe9;--muted:#9aa5a9;--line:#2b3438;
    --accent:#ff6a26;--accent-ink:#1a0c04;--ok:#4cc184;--warn:#e3a744;--bad:#ff7a70;--today:rgba(255,106,38,.10);color-scheme:dark}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3{text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}
a{color:var(--accent)}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:28px;height:28px;border-radius:5px;flex:none;background:repeating-linear-gradient(135deg,var(--accent) 0 6px,var(--ink) 6px 12px)}
.brand h1{margin:0;font:800 19px/1 var(--f-display);font-stretch:80%;text-transform:uppercase;letter-spacing:.02em}
.brand p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.who{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;min-height:34px}
.who i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.tabs{display:flex;gap:4px;padding:8px 18px 0;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:none;background:none;padding:9px 13px 11px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:99px;background:var(--warn);color:#fff;font-size:11px;line-height:18px;text-align:center}

.toolbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:14px 18px}
.weeknav{display:flex;align-items:center;gap:6px}
.wl{font:700 17px/1.2 var(--f-display);font-stretch:88%;margin-left:6px}
.wl small{display:block;font:500 12px var(--f-body);color:var(--muted)}
.sp{flex:1}
select,input[type="text"],input[type="tel"],input[type="date"],input[type="password"],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-height:38px;max-width:100%}
textarea{width:100%;resize:vertical;min-height:70px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer;min-height:38px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.icon{width:38px;padding:0;font-size:18px}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:transparent;color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn[disabled]{opacity:.55;cursor:wait}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:none;background:none;padding:7px 12px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

main{padding:0 18px 48px}
#toolbar[hidden]+main{padding-top:16px}
.empty{padding:32px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px}
.scroll{overflow-x:auto;border-radius:8px}
.sec{margin:18px 0 8px;font:700 13px var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec:first-child{margin-top:0}

/* Semaine */
.wk{display:grid;grid-template-columns:200px repeat(6,minmax(138px,1fr));min-width:1030px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.wk>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px}
.wk .hd{background:var(--paper);padding:8px 10px}
.hd .d{font:600 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.hd .n{font:700 20px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.hd .n span{font-size:13px;font-weight:600;color:var(--muted)}
.hd.today .n{color:var(--accent)}
.today{background:var(--today)}
.grp{grid-column:1/-1;background:var(--paper);font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;align-items:center;gap:8px;padding:6px 10px !important}
.grp i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.rn{display:flex;gap:10px;align-items:flex-start;padding:10px !important}
.rn i{width:5px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.rn b{display:block;font-size:14px;line-height:1.25}
.rn span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.cell{display:flex;flex-direction:column;gap:6px;min-height:88px}
.add{margin-top:auto;width:100%;height:24px;border-radius:5px;border:1px dashed var(--muted);background:transparent;color:var(--muted);cursor:pointer;opacity:0}
.cell:hover .add,.add:focus-visible{opacity:1}
@media (hover:none){.add{opacity:.6}}

.chip{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;cursor:pointer;color:var(--ink);background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));border-left:4px solid var(--c);border-radius:5px;padding:5px 7px}
.chip:hover{background:color-mix(in srgb,var(--c) 17%,var(--surface))}
.chip .q{font:700 10.5px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.chip .t{font-weight:700;font-size:13px;line-height:1.25}
.chip .s{font-size:12.5px;line-height:1.3}
.chip .m{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font:500 11px var(--f-mono);color:var(--muted)}
.st{font:700 10.5px var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:99px;white-space:nowrap}
.st.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.st.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,transparent)}
.st.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.st.neutral{color:var(--muted);background:color-mix(in srgb,var(--muted) 14%,transparent)}

.agenda{display:grid;gap:12px}
.agd{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.agd h3{margin:0;font:700 16px var(--f-display);font-stretch:90%;display:flex;gap:8px;align-items:center}
.agd.today{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.agd .none{font-size:13px;color:var(--muted)}

/* Mon planning */
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.card.late{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));border-left-color:var(--warn)}
.card h3{margin:0;font:700 17px/1.2 var(--f-display);font-stretch:88%}
.card .when{font:500 12.5px var(--f-mono);color:var(--muted)}
.card .tr{font-weight:600}
.card .info{font-size:13.5px;display:grid;gap:3px}
.card .info span{color:var(--muted)}
.card .cons{white-space:pre-wrap;font-size:13.5px;background:var(--paper);border-radius:6px;padding:7px 9px;margin:0}
.card .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.hello{font:700 22px/1.2 var(--f-display);font-stretch:88%;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}

/* Gantt */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.legend .band{width:18px;border:1px dashed var(--muted);background:transparent}
.gt{--name:230px;--cw:32px;position:relative;width:max-content;min-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.gt-row{display:flex;border-bottom:1px solid var(--line);position:relative}
.gt-row:last-child{border-bottom:none}
.gt-name{position:sticky;left:0;z-index:3;width:var(--name);flex:none;background:var(--surface);border-right:1px solid var(--line);padding:8px 10px}
.gt-name b{display:block;font-size:13.5px;line-height:1.25}
.gt-name span{display:block;font-size:12px;color:var(--muted)}
.pg{margin-top:5px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.pg u{display:block;height:100%;background:var(--ok)}
.gt-track{position:relative;width:calc(var(--n) * var(--cw));flex:none;background-image:repeating-linear-gradient(to right,transparent 0 calc(var(--cw) - 1px),color-mix(in srgb,var(--line) 55%,transparent) calc(var(--cw) - 1px) var(--cw))}
.gt-head .gt-name{background:var(--paper);font:600 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;align-items:flex-end}
.gt-head .gt-track{background:var(--paper);height:46px;background-image:none}
.gt-wk{position:absolute;top:6px;font:700 12.5px var(--f-display);white-space:nowrap;padding-left:5px;border-left:1px solid var(--line);height:38px}
.gt-dn{position:absolute;bottom:4px;width:var(--cw);text-align:center;font:500 10.5px var(--f-mono);color:var(--muted)}
.gt-dn.we{opacity:.55}
.gt-dn.now{color:var(--accent);font-weight:700}
.gt-we{position:absolute;top:0;bottom:0;width:var(--cw);background:color-mix(in srgb,var(--muted) 9%,transparent);pointer-events:none}
.gt-now{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);pointer-events:none;z-index:2}
.gt-band{position:absolute;top:4px;bottom:4px;border:1px dashed color-mix(in srgb,var(--muted) 60%,transparent);background:color-mix(in srgb,var(--muted) 7%,transparent);border-radius:4px}
.gt-bar{position:absolute;z-index:1;height:22px;border:none;border-radius:4px;background:var(--c);color:#fff;font:600 11.5px/22px var(--f-body);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;cursor:pointer}
.gt-bar.late{box-shadow:0 0 0 2px var(--warn)}
.gt-bar.bad{box-shadow:0 0 0 2px var(--bad)}
.gt-bar.done{opacity:.7}

/* Bureau */
.g-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.g-grid .wide{grid-column:1/-1}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.box-h h2{margin:0;font:700 16px var(--f-display);font-stretch:90%;text-transform:uppercase;letter-spacing:.03em}
.tblw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);background:var(--paper);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--paper)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:7px}
.muted{color:var(--muted);font-size:12.5px}

/* Volet, fenêtres */
.ov{position:fixed;inset:0;background:rgba(10,14,15,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:41;border-left:1px solid var(--line);overflow-y:auto}
.dr-h{padding:16px 18px 14px;border-bottom:1px solid var(--line);border-top:5px solid var(--c);display:flex;gap:10px;align-items:flex-start}
.dr-h h2{margin:0;font:700 20px/1.2 var(--f-display);font-stretch:88%}
.dr-h p{margin:4px 0 0;color:var(--muted);font-size:13px}
.dr-b{padding:14px 18px 22px;display:grid;gap:14px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted);font-size:12.5px;padding-top:1px}
.kv dd{margin:0}
.notes{white-space:pre-wrap;font-size:14px;background:var(--paper);border-radius:6px;padding:9px 11px;margin:0}
.pt{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:10px}
.pt h3{margin:0;font:700 14px var(--f-display);text-transform:uppercase;letter-spacing:.05em;font-stretch:90%}
.choice{display:flex;flex-wrap:wrap;gap:6px}
.choice button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13.5px;cursor:pointer;min-height:36px}
.choice button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.dlg{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,calc(100% - 20px));max-height:calc(100% - 20px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 18px 16px;display:grid;gap:12px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
#modal .ov{z-index:50}
.dlg h2{margin:0;font:700 19px var(--f-display);font-stretch:88%}
.fld{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.fld>select,.fld>input,.fld>textarea{color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.err{margin:0;color:var(--bad);font-size:13px;min-height:1em}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pick{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pick button{text-align:left;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--surface);border-radius:6px;padding:8px 10px;cursor:pointer;font-weight:600}
.pick button span{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 28px)}
.loading{padding:60px 18px;text-align:center;color:var(--muted)}

@media (max-width:760px){
  .top{padding:9px 12px}
  .tabs{padding:6px 8px 0}
  .toolbar{padding:12px}
  main{padding:0 12px 40px}
  .g-grid{grid-template-columns:1fr}
  .gt{--name:140px;--cw:26px}
  .two,.three{grid-template-columns:1fr}
  .brand p{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
<style>
.notice{margin:14px 18px 0;padding:10px 14px;border-radius:8px;border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--surface));font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tchk{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));max-height:220px;overflow-y:auto;padding:2px}
.tchk label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;padding:6px 8px;font-size:13.5px;color:var(--ink);cursor:pointer}
.tchk input{width:18px;height:18px;accent-color:var(--accent)}
.sw{border:none;padding:0;margin:0;display:flex;gap:8px;flex-wrap:wrap}
.sw legend{font-size:13px;color:var(--muted);margin-bottom:4px;padding:0}
.sw label{position:relative;cursor:pointer}
.sw input{position:absolute;opacity:0;inset:0}
.sw span{display:block;width:28px;height:28px;border-radius:6px;background:var(--c);border:2px solid transparent}
.sw input:checked+span{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.help{margin-top:16px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;font-size:14px;max-width:860px}
.help h3{margin:0 0 6px;font:700 15px var(--f-display);font-stretch:90%;text-transform:uppercase;letter-spacing:.03em}
.help ol{margin:0;padding-left:20px;display:grid;gap:4px}
.who[disabled]{cursor:default}
input[type="number"]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-height:38px;max-width:100%}
.ph{display:flex;gap:6px;flex-wrap:wrap}
.ph .th{position:relative;display:block;width:76px;height:76px;border-radius:6px;overflow:hidden;background:var(--paper);border:1px solid var(--line);padding:0;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .rm{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;font-size:15px;line-height:24px;padding:0}
.ph .miss{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-align:center;padding:4px}
.rps{display:grid;gap:8px}
.rp{border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:8px;padding:10px 12px;display:grid;gap:6px;background:var(--surface)}
.rp-h{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.rp-h .sp{flex:1}
.rp .obs{white-space:pre-wrap;font-size:14px;margin:0}
.hrs{font:700 13px var(--f-mono);white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

(function(){
"use strict";
const LS={get(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}},set(k,v){try{if(v)localStorage.setItem(k,v);else localStorage.removeItem(k);}catch(e){}}};
const rnd=n=>Array.from(crypto.getRandomValues(new Uint8Array(n))).map(b=>b.toString(16).padStart(2,'0')).join('');
let token=LS.get('atlas-token');let mode='';let uid='';let ME=null;

let DEV=LS.get('atlas-dev');if(!DEV||DEV.length<16){DEV=rnd(16);LS.set('atlas-dev',DEV);}
const UA=navigator.userAgent||'';
const IOS=/iPhone|iPad|iPod/.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const STANDALONE=!!((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true);

const LANGS=[['fr','Français'],['sq','Shqip (albanais)'],['pt','Português'],['tr','Türkçe'],['ar','العربية (arabe)'],['ro','Română'],['pl','Polski'],['es','Español'],['it','Italiano'],['en','English'],['de','Deutsch'],['hr','Hrvatski / Srpski / Bosanski'],['uk','Українська'],['ru','Русский']];

const MODELE=/iPhone/.test(UA)?'iPhone':/iPad/.test(UA)?'iPad':/Android/.test(UA)?(((/;\s*([^;)]+?)\s+Build\//.exec(UA))||[])[1]||'Android'):/Windows/.test(UA)?'PC Windows':/Mac/.test(UA)?'Mac':'Navigateur';
function rpc(fn){const args=[].slice.call(arguments,1);
  const fail=e=>{const err=e instanceof Error?e:new Error(String(e&&e.message||e));if(/session/.test(String(err.message))&&ME)perdu();throw err;};
  if(CFG.api)return fetch(CFG.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})})
    .then(r=>{if(!r.ok)throw new Error('hors ligne');return r.json();},()=>{throw new Error('hors ligne');})
    .then(j=>{if(!j||!j.ok)throw new Error((j&&j.e)||'Erreur');return j.r;}).catch(fail);
  return new Promise((ok,ko)=>{
    if(typeof google==='undefined'||!google.script||!google.script.run){ko(new Error('hors ligne'));return;}
    google.script.run.withSuccessHandler(ok).withFailureHandler(e=>{try{fail(e);}catch(x){ko(x);}})[fn].apply(null,args);});}

function ui(html){let d=document.getElementById('atlas-setup');if(!d){d=document.createElement('div');d.id='atlas-setup';document.body.appendChild(d);}d.innerHTML=`<div class="box2">${html}</div>`;return d;}
function closeUi(){const d=document.getElementById('atlas-setup');if(d)d.remove();}
const MSG={tel:'Numéro de téléphone invalide.',inconnu_tel:"Ce numéro n'est pas enregistré. Demande au bureau de le mettre sur ta fiche.",plus_de_demande:"Cette demande n'existe plus.",mail:'Adresse mail invalide.',inconnu:"Cette adresse n'est pas enregistrée. Demande au bureau de l'ajouter.",trop:"Trop de demandes. Attends un quart d'heure.",faux:'Code incorrect.',expire:'Code expiré. Redemande un code.',autre_tel:"Ce compte est déjà relié à un autre téléphone. Demande au bureau de le libérer (onglet Bureau, tableau Techniciens).",appareil:'Appareil non reconnu. Recharge la page.'};
const msg=e=>{const m=clean(e);return MSG[m]||(/hors ligne|NetworkError|network/i.test(m)?'Pas de connexion internet.':m||'Erreur, réessaie.');};
function ecranConnexion(){
  return new Promise(done=>{
    const d=ui(`${choixLangue()}<div class="brand"><span class="mark" aria-hidden="true"></span><div><h2>Planning chantiers</h2><p>Atlas Énergie</p></div></div>
      <div id="as-t1"><p>Entre ton numéro de téléphone.</p>
      <label class="fld" for="as-t">Numéro de téléphone<div class="row"><input type="tel" id="as-t" autocomplete="tel" inputmode="tel" placeholder="06 12 34 56 78" value="${esc(LS.get('atlas-tel'))}"><button class="btn primary" type="button" id="as-tgo">Continuer</button></div></label>
      <p><button type="button" class="lien" id="as-vm">Bureau : se connecter avec une adresse mail</button></p></div>
      <div id="as-w" hidden><p class="attente">⏳ <b>Demande envoyée au bureau.</b></p><p>Dès que le bureau valide, le planning s'ouvre tout seul. Laisse l'appli ouverte.</p>
      <div class="row"><button class="btn" type="button" id="as-wx">Annuler</button></div></div>
      <div id="as-1" hidden><p>Entre ton adresse mail. Tu vas recevoir un code à 6 chiffres.</p>
      <label class="fld" for="as-m">Adresse mail<div class="row"><input type="email" id="as-m" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" value="${esc(LS.get('atlas-mail'))}"><button class="btn primary" type="button" id="as-go">Recevoir mon code</button></div></label>
      <p><button type="button" class="lien" id="as-vt">Technicien : se connecter avec son numéro</button></p></div>
      <div id="as-2" hidden><p id="as-info"></p>
      <label class="fld" for="as-c">Code reçu par mail<div class="row"><input type="text" id="as-c" inputmode="numeric" autocomplete="one-time-code" maxlength="6"><button class="btn primary" type="button" id="as-ok">Valider</button></div></label>
      <div class="row"><button class="btn" type="button" id="as-back">Changer d'adresse</button><button class="btn" type="button" id="as-again">Renvoyer un code</button></div></div>
      <p class="err" id="as-e" role="alert"></p>`);
    const $=q=>d.querySelector(q),err=t=>{$('#as-e').textContent=t||'';};
    brancherLangue(d);
    let mail='';
    const montre=id=>{['#as-t1','#as-w','#as-1','#as-2'].forEach(x=>{$(x).hidden=x!==id;});};
    $('#as-vm').onclick=()=>{montre('#as-1');err('');$('#as-m').focus();};
    $('#as-vt').onclick=()=>{montre('#as-t1');err('');$('#as-t').focus();};
    if(LS.get('atlas-mail')&&!LS.get('atlas-tel'))montre('#as-1');
    let fini=true;
    const attendre=t=>{montre('#as-w');LS.set('atlas-attente','1');fini=false;
      const tour=async()=>{if(fini)return;
        try{const r=await rpc('etatAcces',t,DEV);if(fini)return;
          if(r&&r.token){fini=true;LS.set('atlas-attente','');token=r.token;LS.set('atlas-token',token);done(r);return;}
          if(r&&r.refuse){fini=true;LS.set('atlas-attente','');montre('#as-t1');err("Le bureau n'a pas validé la demande. Recommence ou appelle le bureau.");return;}}
        catch(e){}
        setTimeout(tour,4000);};
      setTimeout(tour,2500);};
    $('#as-wx').onclick=()=>{fini=true;LS.set('atlas-attente','');montre('#as-t1');};
    const demander=async()=>{const t=$('#as-t').value.trim();err('');
      if(t.replace(/\D/g,'').length<8){err(MSG.tel);return;}
      const b=$('#as-tgo');b.disabled=true;b.textContent='Envoi…';
      try{const r=await rpc('demanderAcces',t,DEV,MODELE);LS.set('atlas-tel',t);
        if(r&&r.token){token=r.token;LS.set('atlas-token',token);done(r);return;}
        attendre(t);}
      catch(e){err(msg(e));}
      b.disabled=false;b.textContent='Continuer';};
    $('#as-tgo').onclick=demander;$('#as-t').onkeydown=e=>{if(e.key==='Enter')demander();};
    if(LS.get('atlas-attente')==='1'&&LS.get('atlas-tel'))attendre(LS.get('atlas-tel'));
    const envoyer=async()=>{mail=$('#as-m').value.trim().toLowerCase();err('');
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)){err(MSG.mail);return;}
      const b=$('#as-go'),b2=$('#as-again');b.disabled=b2.disabled=true;b.textContent='Envoi…';
      try{await rpc('demanderCode',mail,DEV);LS.set('atlas-mail',mail);montre('#as-2');
        $('#as-info').innerHTML=`Code envoyé à <b>${esc(mail)}</b>. Regarde aussi dans les spams.`;$('#as-c').value='';$('#as-c').focus();}
      catch(e){err(msg(e));}
      b.disabled=b2.disabled=false;b.textContent='Recevoir mon code';};
    const valider=async()=>{const c=$('#as-c').value.replace(/\D/g,'');err('');if(c.length!==6){err('Le code fait 6 chiffres.');return;}
      const b=$('#as-ok');b.disabled=true;
      try{const r=await rpc('valider',mail,c,DEV,MODELE);token=r.token;LS.set('atlas-token',token);done(r);}
      catch(e){err(msg(e));if(clean(e)==='expire')montre('#as-1');}
      b.disabled=false;};
    $('#as-go').onclick=envoyer;$('#as-m').onkeydown=e=>{if(e.key==='Enter')envoyer();};
    $('#as-ok').onclick=valider;$('#as-c').onkeydown=e=>{if(e.key==='Enter')valider();};
    $('#as-c').oninput=()=>{if($('#as-c').value.replace(/\D/g,'').length===6)valider();};
    $('#as-back').onclick=()=>{montre('#as-1');err('');$('#as-m').focus();};
    $('#as-again').onclick=envoyer;
  });
}

  d.textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>{d.remove();},5000);}

/* ---------- Traduction automatique de l'interface et des textes ---------- */
const ORIG=new WeakMap(),POSE=new WeakMap(),TR={};let attente=new Map(),minuteur=null,NOMS=new Set();
const cacheTr=l=>{if(!TR[l]){try{TR[l]=JSON.parse(localStorage.getItem('atlas-tr-'+l)||'{}');}catch(e){TR[l]={};}}return TR[l];};
const garderTr=l=>{try{localStorage.setItem('atlas-tr-'+l,JSON.stringify(TR[l]));}catch(e){}};
const IGN=new Set(['SCRIPT','STYLE','TEXTAREA','INPUT','NOSCRIPT','CODE']);
function majNoms(){const n=new Set();['equipes','techniciens','chantiers','acces'].forEach(c=>((store.cols[c]||{}).docs||[]).forEach(d=>['nom','prenom','nomFamille','client','adresse','contact','code','vehicule'].forEach(k=>{const v=String(d.data[k]||'').trim();if(v)n.add(v);})));NOMS=n;}
function aTraduire(t){const x=t.trim();if(!x||!/[A-Za-zÀ-ÿ]{2}/.test(x)||/@|https?:/.test(x)||NOMS.has(x))return '';return x;}
function exclu(el){return !el||IGN.has(el.tagName)||!!el.closest('[translate="no"],.notranslate');}
function poser(node,txt){POSE.set(node,txt);node.nodeValue=txt;}
function traduireNoeud(node){
  if(exclu(node.parentElement))return;
  let o=ORIG.get(node);const cur=node.nodeValue;
  if(o===undefined||(POSE.get(node)!==cur&&cur!==o)){o=cur;ORIG.set(node,o);}
  const c=aTraduire(o);
  if(LANG==='fr'||!c){if(cur!==o)poser(node,o);return;}
  const tr=cacheTr(LANG)[c];
  if(tr!=null){const v=o.replace(c,tr);if(cur!==v)poser(node,v);}
  else{if(!attente.has(c))attente.set(c,[]);attente.get(c).push(node);planifier();}
}
const ATTR=['placeholder','title','aria-label'];
function traduireAttr(el){
  if(exclu(el))return;
  ATTR.forEach(a=>{if(!el.hasAttribute(a))return;const k='data-o-'+a;let o=el.getAttribute(k);const cur=el.getAttribute(a);
    if(o===null||(cur!==o&&el.getAttribute('data-t-'+a)!==cur)){o=cur;el.setAttribute(k,o);}
    const c=aTraduire(o);if(LANG==='fr'||!c){if(cur!==o)el.setAttribute(a,o);return;}
    const tr=cacheTr(LANG)[c];if(tr!=null){const v=o.replace(c,tr);el.setAttribute('data-t-'+a,v);if(cur!==v)el.setAttribute(a,v);}
    else{if(!attente.has(c))attente.set(c,[]);attente.get(c).push(el);planifier();}});
}
function parcourir(root){
  if(!root)return;
  if(root.nodeType===3){traduireNoeud(root);return;}
  if(root.nodeType!==1||exclu(root))return;
  traduireAttr(root);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n;
  while((n=w.nextNode())){if(n.nodeType===3)traduireNoeud(n);else traduireAttr(n);}
}
function planifier(){clearTimeout(minuteur);minuteur=setTimeout(envoyer,200);}
async function envoyer(){
  const l=LANG,lot=attente;attente=new Map();const textes=[...lot.keys()];
  for(let i=0;i<textes.length;i+=60){const part=textes.slice(i,i+60);
    try{const r=await rpc('traduire',part,l);const cache=cacheTr(l);part.forEach((t,k)=>{cache[t]=r[k]||t;});garderTr(l);}
    catch(e){console.warn('traduction',e);continue;}
    if(l!==LANG)return;
    part.forEach(t=>(lot.get(t)||[]).forEach(n=>{if(n.nodeType===3)traduireNoeud(n);else traduireAttr(n);}));}
}
function appliquerLangue(){
  document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  majNoms();parcourir(document.body);
}
function changerLangue(l){LANG=l;LS.set('atlas-lang',l==='fr'?'':l);appliquerLangue();}
new MutationObserver(ms=>{if(LANG==='fr')return;ms.forEach(m=>{
  if(m.type==='characterData'){if(POSE.get(m.target)!==m.target.nodeValue)traduireNoeud(m.target);}
  else if(m.type==='attributes'){traduireAttr(m.target);}
  else m.addedNodes.forEach(n=>parcourir(n));});}).observe(document.documentElement,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:ATTR});
const choixLangue=()=>`<label class="lang" translate="no">🌐 <select id="as-lang" aria-label="Langue">${LANGS.map(l=>`<option value="${l[0]}"${l[0]===LANG?' selected':''}>${esc(l[1])}</option>`).join('')}</select></label>`;

/* ---------- Données ---------- */
const store={v:0,loaded:false,cols:{}}; // col -> {sig, docs}
const listeners={};
const snap=docs=>{const d=(docs||[]).map(x=>({id:x.id,exists:true,data:()=>x.data,metadata:{fromCache:false,hasPendingWrites:false}}));
  return {docs:d,size:d.length,empty:!d.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]};};
function emit(col){const c=store.cols[col]||{docs:[]};(listeners[col]||[]).slice().forEach(f=>{try{f(snap(c.docs));}catch(e){console.error(e);}});}
function apply(res){
  if(!res||res.same){if(res&&res.v)store.v=res.v;return;}
  let rows=[];try{rows=JSON.parse(res.docs||'[]');}catch(e){return;}
  const by={};rows.forEach(r=>{let d=null;try{d=JSON.parse(r[2]);}catch(e){}if(d&&typeof d==='object')(by[r[0]]=by[r[0]]||[]).push({id:r[1],data:d});});
  const keys=new Set(Object.keys(by).concat(Object.keys(store.cols)).concat(Object.keys(listeners)));
  store.v=res.v;const first=!store.loaded;store.loaded=true;
  keys.forEach(col=>{const docs=(by[col]||[]).sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);const sig=JSON.stringify(docs);
    const old=store.cols[col];if(first||!old||old.sig!==sig){store.cols[col]={sig,docs};emit(col);}});
  offline(false);
  try{majNoms();majDemandes();}catch(e){console.warn(e);}
}
function majDemandes(){
  let box=document.getElementById('atlas-dem');
  const l=mode==='bureau'?((store.cols.demandes||{}).docs||[]):[];
  if(!l.length){if(box)box.remove();return;}
  if(!box){box=document.createElement('div');box.id='atlas-dem';box.setAttribute('role','region');box.setAttribute('aria-label','Demandes de connexion');document.body.appendChild(box);
    box.addEventListener('click',async ev=>{const b=ev.target.closest('[data-dem-ok],[data-dem-non]');if(!b)return;
      const ok=b.hasAttribute('data-dem-ok'),id=ok?b.dataset.demOk:b.dataset.demNon;
      if(!ok&&!confirm('Refuser cette demande de connexion ?'))return;
      box.querySelectorAll('button').forEach(x=>x.disabled=true);
      try{apply(await rpc(ok?'autoriserAcces':'refuserAcces',id,token));toast(ok?'Téléphone autorisé. Le technicien est connecté.':'Demande refusée.');}
      catch(e){toast(msg(e));sync(true);}
      box.querySelectorAll('button').forEach(x=>x.disabled=false);});}
  box.innerHTML=l.map(x=>{const d=x.data||{};const q=d.le?new Date(d.le):null;
    return `<div class="d"><p>📲 <b>${esc(d.nom||'Un technicien')}</b> veut se connecter${d.modele?' sur un <b>'+esc(d.modele)+'</b>':''}${q&&!isNaN(q)?' ('+q.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+')':''}.<br><span style="color:var(--muted)">Autorise seulement si c'est bien son téléphone.</span></p>
      <button class="btn primary" type="button" data-dem-ok="${esc(x.id)}">Autoriser</button><button class="btn" type="button" data-dem-non="${esc(x.id)}">Refuser</button></div>`;}).join('');
}
let syncing=null,again=false;
function sync(force){
  if(syncing){again=true;return syncing;}
  syncing=rpc('sync',force?-1:store.v,token).then(apply).catch(()=>offline(true)).finally(()=>{syncing=null;if(again){again=false;sync();}});
  return syncing;
}
let offEl=null;
function offline(on){if(on&&!offEl){offEl=document.createElement('div');offEl.id='atlas-off';offEl.textContent='Pas de connexion avec le planning. Les changements reviendront dès que le réseau revient.';document.body.appendChild(offEl);}if(!on&&offEl){offEl.remove();offEl=null;}}
setInterval(()=>{if(document.visibilityState==='visible'&&store.loaded)sync();},15000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&store.loaded)sync();});
const okPath=(p,even)=>{const s=String(p).split('/');return s.length%2===(even?0:1)&&s.every(x=>/^[A-Za-z0-9_.-]{1,160}$/.test(x));};
function dbErr(e){const m=clean(e);return {code:m==='droits'||/invalide/i.test(m)?'invalid_argument':'unavailable',message:m};}
function docRef(p){
  if(!okPath(p,true))throw new TypeError('chemin de document invalide : '+p);
  return {id:p.split('/').pop(),path:p,
    set:async d=>{const n=!!window.__atlasNotif;window.__atlasNotif=false;try{apply(await rpc('put',p,JSON.stringify(d),token,n));}catch(e){throw dbErr(e);}},
    update:async()=>{throw {code:'invalid_argument',message:'non disponible'};},
    delete:async()=>{const n=!!window.__atlasNotif;window.__atlasNotif=false;try{apply(await rpc('del',p,token,n));}catch(e){throw dbErr(e);}},
    get:async()=>{const col=p.split('/').slice(0,-1).join('/');const c=store.cols[col];const d=c&&c.docs.find(x=>x.id===p.split('/').pop());return {id:p.split('/').pop(),exists:!!d,data:()=>d&&d.data,metadata:{fromCache:false,hasPendingWrites:false}};},
    collection:sub=>collection(p+'/'+sub)};
}
function collection(path){
  if(!okPath(path,false))throw new TypeError('chemin de collection invalide : '+path);
  return {path,
    onSnapshot(next){(listeners[path]=listeners[path]||[]).push(next);
      if(store.loaded)setTimeout(()=>next(snap((store.cols[path]||{}).docs)),0);else sync(true);
      return ()=>{const a=listeners[path]||[];const k=a.indexOf(next);if(k>=0)a.splice(k,1);};},
    doc:id=>docRef(path+'/'+(id||rnd(10))),
    add:async d=>{const r=docRef(path+'/'+rnd(10));await r.set(d);return r;},
    get:async()=>snap((store.cols[path]||{}).docs)};
}

/* ---------- Photos (privées, chargées par le script) ---------- */
const PH='data:image/svg+xml;utf8,'+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='8' height='8'><rect width='8' height='8' fill='#e9ebe8'/></svg>");
const photoCache=new Map();
window.__atlasBlob=id=>{const c=photoCache.get(id);return (c&&typeof c==='string')?c:PH+'#atlas-'+id;};
function loadPhoto(id){if(!photoCache.has(id))photoCache.set(id,rpc('getPhoto',id,token).then(u=>{if(u)photoCache.set(id,u);else photoCache.set(id,'');return u;}).catch(()=>{photoCache.delete(id);return '';}));
  const c=photoCache.get(id);return typeof c==='string'?Promise.resolve(c):c;}
function fill(img){const m=/#atlas-([A-Za-z0-9_-]+)$/.exec(img.getAttribute('src')||'');if(!m)return;const id=m[1];
  loadPhoto(id).then(u=>{if(!img.isConnected)return;if(u)img.src=u;else{const th=img.closest('.th');if(th&&!th.classList.contains('miss')){th.classList.add('miss');th.textContent='Photo indisponible';}}});}
new MutationObserver(ms=>{ms.forEach(m=>{m.addedNodes.forEach(n=>{if(n.nodeType!==1)return;if(n.tagName==='IMG')fill(n);n.querySelectorAll&&n.querySelectorAll('img[src*="#atlas-"]').forEach(fill);});
  if(m.type==='attributes'&&m.target.tagName==='IMG')fill(m.target);});}).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['src']});
const toB64=blob=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=ko;r.readAsDataURL(blob);});
/* Documents de chantier (PDF ou photo) */
async function reduireImage(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,ko)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=ko;im.src=url;});
    const M=2400;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,M/Math.max(w,h));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    return await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.85));}
  catch(e){return null;}finally{URL.revokeObjectURL(url);}
}
window.__atlasDoc={
  upload:async file=>{
    let b=file,nom=String(file.name||'document');
    const image=/^image\//.test(file.type)||/\.(jpe?g|png|webp|heic|heif)$/i.test(nom);
    if(image){const r=await reduireImage(file);if(!r)throw new Error('unsupported_type');b=r;nom=nom.replace(/\.[^.]*$/,'')+'.jpg';}
    else if(!(file.type==='application/pdf'||/\.pdf$/i.test(nom)))throw new Error('unsupported_type');
    if(b.size>10*1024*1024)throw new Error('too_large');
    const b64=await toB64(b);
    try{const r=await rpc('uploadDoc',b64,nom,token);return Object.assign({nom},r);}
    catch(e){throw new Error(clean(e));}},
  ouvrir:async(id,nom,mime)=>{
    const fen=!PHONE&&mime==='application/pdf'?window.open('','_blank'):null;
    toast('Ouverture du document…');
    let u='';try{u=await rpc('getPhoto',id,token);}catch(e){}
    if(!u){if(fen)fen.close();toast('Document indisponible.');return;}
    if(mime!=='application/pdf'){const d=document.createElement('div');d.className='lightbox';d.setAttribute('role','dialog');d.setAttribute('aria-label','Document');d.innerHTML='<img alt="Document">';d.querySelector('img').src=u;d.onclick=()=>d.remove();document.body.appendChild(d);return;}
    const bin=atob(u.split(',')[1]||'');const arr=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)arr[k]=bin.charCodeAt(k);
    const url=URL.createObjectURL(new Blob([arr],{type:'application/pdf'}));
    if(fen){fen.location.href=url;}
    else{const a=document.createElement('a');a.href=url;a.download=nom||'document.pdf';document.body.appendChild(a);a.click();a.remove();}
    setTimeout(()=>URL.revokeObjectURL(url),120000);},
  remove:id=>{rpc('deletePhoto',id,token).catch(()=>{});},
  vu:id=>{rpc('marquerVu',id,token).then(()=>sync(true)).catch(()=>{});}
};
const assets={
  upload:async blob=>{let b64;try{b64=await toB64(blob);}catch(e){throw {code:'invalid_request',message:'lecture'};}
    try{const r=await rpc('uploadPhoto',b64,token);photoCache.set(r.id,'data:'+(blob.type||'image/jpeg')+';base64,'+b64);return Object.assign(r,{url:window.__atlasBlob(r.id)});}
    catch(e){const m=clean(e);throw {code:m==='too_large'?'too_large':m==='unsupported_type'?'unsupported_type':'store_unavailable',message:m};}},
  delete:async id=>{try{await rpc('deletePhoto',id,token);}catch(e){}photoCache.delete(id);return {deleted:true};},
  list:async()=>({assets:[],usage:{files:0,bytes:0,maxFiles:0,maxBytes:0}})};
const downloads={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;a.target='_blank';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);return {status:'saved'};}};
const user={isOwner:async()=>mode==='bureau',canEdit:async()=>mode==='bureau',can:async()=>true,id:async()=>uid,me:async()=>({id:uid,name:ME?ME.nom:''}),
  profiles:async ids=>{const o={};(ids||[]).forEach(i=>{o[i]={name:'connecté'};});return o;},search:async()=>[]};

window.claude={use:async name=>{await readyP;return name==='db'?db:name==='user'?user:name==='assets'?assets:name==='downloads'?downloads:null;}};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup);else setup();
})();

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const isIso=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;};
const monday=d=>addDays(d,-((d.getDay()+6)%7));
const diff=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/86400000+1)/7);}
const JOURS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const JC=['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'];
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const fmtD=d=>d.getDate()+' '+MOIS[d.getMonth()];
const fmtIso=s=>{if(!isIso(s))return '';const d=parse(s);return JC[(d.getDay()+6)%7]+' '+fmtD(d);};
const fmtShort=s=>{if(!isIso(s))return '';const d=parse(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1);};
const PALETTE=['#2f6fdf','#2e9e6a','#7b5cd6','#b5651d','#1b9aaa','#c8508f','#7f8a1f','#9a6b3f'];
const GREY='#5b6b7a';
const col=c=>/^#[0-9a-fA-F]{6}$/.test(c||'')?c:GREY;
const ST_INT=['À faire','En cours','Fait','Reporté','Problème'];
const ST_CH=['À venir','En cours','En pause','Terminé'];
const ST_ORD={'En cours':0,'À venir':1,'En pause':2,'Terminé':3};
const NJ=42;
const str=v=>typeof v==='string'?v:'';
const ST_RAP=['Fait','En cours','Problème','Reporté'];
const ST_RAP_LBL={'Fait':'C\'est bon, terminé','En cours':'En cours','Problème':'Problème','Reporté':'Reporté'};
const fmtH=n=>(Math.round(n*100)/100).toLocaleString('fr-FR')+' h';
const okId=s=>typeof s==='string'&&/^[A-Za-z0-9_.~:@+-]{1,180}$/.test(s);
const ST_COL='#b5651d';
const isST=t=>!!t&&t.type==='st';
const DOC_ST=['Contrat de sous-traitance','Ordre de service (OS)','Avenant','Autre'];
const MOISL2=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function quand(t){const d=t?new Date(t.length===10?t+'T12:00:00':t):null;if(!d||isNaN(d))return '';const m=Math.round((Date.now()-d.getTime())/60000);
  if(m<1)return 'à l\'instant';if(m<60)return 'il y a '+m+' min';if(m<24*60&&iso(d)===S.today)return 'il y a '+Math.round(m/60)+' h';
  if(iso(d)===iso(addDays(parse(S.today),-1)))return 'hier';return fmtShort(iso(d))+'/'+d.getFullYear();}
const DOC_TYPES=['Attestation d\'entretien','Quitus de levée de réserves','PV de réception','Rapport / compte rendu','Plan / schéma','Devis / bon de commande','Photo','Autre'];

const S={eq:[],te:[],ch:[],it:[],pt:{},liens:{},lienKeys:[],rp:{},R:[],val:{},I:[],today:iso(new Date()),weekStart:monday(new Date()),
  view:'',mode:'equipes',filtre:'',owner:false,canWrite:null,db:null,user:null,uid:null,assets:null,dl:null,ready:false,names:{},asked:false,rsubs:{}};
const ls={get(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}},set(k,v){try{if(v)localStorage.setItem(k,v);else localStorage.removeItem(k);}catch(e){}}};
S.docs=[];S.reg={};S.chantier='';S.calM=null;S.qch='';S.mode=ls.get('atlas-mode')||'equipes';S.filtre=ls.get('atlas-filtre');
const mq=window.matchMedia('(max-width: 760px)');
const narrow=()=>mq.matches;

/* ---------- Données ---------- */
const eqById=id=>S.eq.find(e=>e.id===id);
const teById=id=>S.te.find(t=>t.id===id);
const chById=id=>S.ch.find(c=>c.id===id);
const eqColor=id=>{const e=eqById(id);return e?col(e.couleur):GREY;};
function techs(){const ord=t=>{const e=eqById(t.equipeId);return (e?S.eq.indexOf(e):99)*1e6+(t.ordre||0);};return S.te.filter(t=>!isST(t)).sort((a,b)=>ord(a)-ord(b)||a.nom.localeCompare(b.nom));}
function sts(){return S.te.filter(isST).sort((a,b)=>a.nom.localeCompare(b.nom));}
const isSTid=id=>isST(teById(id));
const meST=()=>isST(myTech());
const named=i=>i.techIds.filter(id=>teById(id));
const stOnly=i=>{const n=named(i);return n.length>0&&n.every(isSTid);};
const hasST=i=>named(i).some(isSTid);
const stNames=i=>named(i).filter(isSTid).map(id=>teById(id).nom).join(', ');
function assignedTo(i,t){const n=named(i);if(n.length)return n.indexOf(t.id)>=0;return !!i.equipeId&&i.equipeId===t.equipeId;}
function teamOf(i){if(i.equipeId&&eqById(i.equipeId))return i.equipeId;const t=teById(named(i)[0]);return t?t.equipeId:'';}
const colorOf=i=>stOnly(i)?ST_COL:eqColor(teamOf(i));
const chName=i=>{const c=chById(i.chantierId);return c?c.nom:'Chantier supprimé';};
const eqName=id=>{const e=eqById(id);return e?e.nom:'';};
const inDay=(i,d)=>i.debut<=d&&i.fin>=d;
function etat(i){if(i.statut==='Fait')return 'fait';if(i.statut==='Problème')return 'probleme';if(i.statut==='Reporté')return 'reporte';if(i.fin<S.today)return 'apointer';return '';}
function tag(i){const e=etat(i);if(e==='fait')return '<b class="st ok">Fait</b>';if(e==='probleme')return '<b class="st bad">Problème</b>';if(e==='reporte')return '<b class="st neutral">Reporté</b>';if(e==='apointer')return '<b class="st warn">À pointer</b>';if(i.statut==='En cours')return '<b class="st neutral">En cours</b>';return '';}
function who(i){const n=named(i);return n.length?n.map(id=>teById(id).nom).join(', '):(i.equipeId?'Toute l\'équipe':'');}
function passFiltre(i){const f=S.filtre;if(!f)return true;const v=f.slice(2);
  if(f[0]==='e')return teamOf(i)===v||named(i).some(id=>teById(id).equipeId===v);
  const t=teById(v);return t?assignedTo(i,t):false;}
const myTech=()=>S.uid&&S.liens[S.uid]?teById(S.liens[S.uid]):null;

function recompute(){
  const R=[];
  Object.keys(S.rp).forEach(uid=>(S.rp[uid]||[]).forEach(r=>{
    if(!isIso(r.date)||!okId(r.interventionId))return;
    R.push({key:uid+'/'+r.id,uid,id:r.id,interventionId:r.interventionId,chantierId:str(r.chantierId),techId:str(r.techId),date:r.date,
      heures:Math.max(0,Math.min(24,Number(r.heures)||0)),statut:ST_RAP.indexOf(r.statut)>=0?r.statut:'',observation:str(r.observation),
      photos:Array.isArray(r.photos)?r.photos.filter(p=>typeof p==='string'&&/^[A-Za-z0-9_-]{8,64}$/.test(p)).slice(0,12):[],le:str(r.le)});
  }));
  R.sort((a,b)=>a.date.localeCompare(b.date)||a.le.localeCompare(b.le));
  S.R=R;const by={};R.forEach(r=>{(by[r.interventionId]=by[r.interventionId]||[]).push(r);});
  S.I=S.it.filter(i=>isIso(i.debut)&&isIso(i.fin)&&i.fin>=i.debut&&chById(i.chantierId)).map(i=>{
    const p=S.pt[i.id]||{};const rs=by[i.id]||[];const last=rs.length?rs[rs.length-1]:null;
    const statut=last&&last.statut?last.statut:(ST_INT.indexOf(p.statut)>=0?p.statut:(p.fait?'Fait':''));
    return Object.assign({},i,{techIds:Array.isArray(i.techIds)?i.techIds.filter(x=>typeof x==='string'):[],
      travaux:str(i.travaux)||str(i.libelle),consignes:str(i.consignes)||str(i.notes),horaire:str(i.horaire),
      statut,remarque:last?last.observation:str(p.remarque),lastTech:last?last.techId:str(p.parTech),
      rapports:rs,heures:rs.reduce((s,r)=>s+r.heures,0)});
  });
  if(!S.owner){const me=myTech();if(me&&!isST(me)&&!(S.reg&&S.reg.stVisibles===true))S.I=S.I.filter(i=>!stOnly(i));}
}
const wkKey=d=>iso(monday(parse(d)));
const isValid=(techId,date)=>!!S.val[techId+'_'+wkKey(date)];
const rapChName=r=>{const c=chById(r.chantierId)||chById((S.it.find(i=>i.id===r.interventionId)||{}).chantierId);return c?c.nom:'Chantier supprimé';};
const rapChId=r=>r.chantierId||(S.it.find(i=>i.id===r.interventionId)||{}).chantierId||'';
const blob=id=>window.__atlasBlob?window.__atlasBlob(id):'/_blob/'+id;
function photosHtml(ids,opt){opt=opt||{};if(!ids.length)return '';
  return `<div class="ph">${ids.map(id=>`<button type="button" class="th" data-photo="${esc(id)}" aria-label="Voir la photo"><img src="${blob(id)}" alt="Photo du chantier" loading="lazy">${opt.rm?`<span class="rm" data-rm="${esc(id)}" role="button" aria-label="Retirer la photo">×</span>`:''}</button>`).join('')}</div>`;}
function rapHtml(r,opt){opt=opt||{};const t=teById(r.techId);const st=r.statut;
  const tg=st==='Fait'?'<b class="st ok">C\'est bon</b>':st==='Problème'?'<b class="st bad">Problème</b>':st==='Reporté'?'<b class="st neutral">Reporté</b>':st==='En cours'?'<b class="st neutral">En cours</b>':'';
  const can=S.owner||(r.uid===S.uid&&!isValid(r.techId,r.date));
  return `<div class="rp" style="--c:${t?eqColor(t.equipeId):GREY}"><div class="rp-h"><b>${fmtIso(r.date)}</b><span>${esc(t?t.nom:'Technicien supprimé')}</span><span class="hrs">${r.heures?fmtH(r.heures):''}</span>${tg}${isValid(r.techId,r.date)?'<span class="muted">validé</span>':''}<span class="sp"></span>${can?`<button type="button" class="linkish" data-edit-rap="${esc(r.key)}">Modifier</button>`:''}</div>
    ${opt.ch||opt.travaux?`<div class="muted">${opt.ch?esc(rapChName(r)):''}${opt.ch&&opt.travaux?' · ':''}${opt.travaux?esc(opt.travaux):''}</div>`:''}
    ${r.observation?`<p class="obs">${esc(r.observation)}</p>`:''}${photosHtml(r.photos)}</div>`;}

/* ---------- Messages ---------- */
let tT=0;

async function write(ref,data,kind){
  try{if(data===null)await ref.delete();else await ref.set(data);return true;}
  catch(e){const c=e&&e.code;
    if(c==='invalid_argument'){if(kind==='point'||kind==='rap'){if(kind==='point')S.canWrite=false;toast("Ton accès ne permet pas d'enregistrer ce rapport. Demande au bureau de vérifier ton adresse mail.");}else if(kind==='lien'){toast("Ton accès ne permet pas d'enregistrer ton nom. Demande au bureau de vérifier ton adresse mail.");}else toast("Seul le responsable du planning peut faire cette modification.");}
    else if(c==='quota_exceeded')toast("La base du planning est pleine. Supprime d'anciens chantiers.");
    else toast('Enregistrement impossible pour le moment. Réessaie dans un instant.');
    return false;}
}
const coll=n=>S.db.collection(n);

/* ---------- Rendu ---------- */
function views(){const v=[];const me=myTech();if(me)v.push(['moi','Mon planning']);if(isST(me))return v;
  v.push(['semaine',S.owner?'Salariés':'Semaine']);if(S.owner)v.push(['soustraitants','Sous-traitants']);v.push(['chantiers','Chantiers']);if(S.owner)v.push(['heures','Heures'],['bureau','Bureau']);return v;}
let raf=0;function render(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;draw();});}
function apresDraw(){if(S.view==='chantiers'&&!S.chantier&&S.qch)filtrerChantiers();}
function draw(){
  const vs=views();if(!vs.some(x=>x[0]===S.view))S.view=vs[0][0];

  $('#toolbar').hidden=!(S.view==='semaine'||S.view==='soustraitants'||S.view==='heures');

  document.querySelectorAll('#mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===S.mode));
  $('#addInter').hidden=!S.owner;
  if(S.owner&&S.ch.some(c=>c.exemple))setNotice('ex',`<span>Le planning contient des chantiers d'exemple. Renomme les techniciens et les équipes dans Bureau, puis retire les exemples.</span><button class="btn" type="button" id="delEx">Supprimer les chantiers d'exemple</button>`);else setNotice('ex',null);

  if(!S.db){m.innerHTML='<div class="empty">Le planning ne répond pas. Vérifie la connexion internet.</div>';return;}
  if(S.view==='moi')m.innerHTML=drawMoi();
  else if(S.view==='semaine')m.innerHTML=narrow()?drawAgenda():drawSemaine();
  else if(S.view==='chantiers'){const f=document.activeElement&&document.activeElement.id==='chq';const pos=f?document.activeElement.selectionStart:0;m.innerHTML=drawChantiers();apresDraw();if(f){const q=document.getElementById('chq');if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(e){}}}}

  else if(S.view==='heures')m.innerHTML=drawHeures();
  else m.innerHTML=drawBureau();
}
function drawFiltre(){
  const o=['<option value="">Tout le monde</option>','<optgroup label="Équipes">'+S.eq.map(e=>`<option value="e:${esc(e.id)}">${esc(e.nom)}</option>`).join('')+'</optgroup>',
    '<optgroup label="Techniciens">'+techs().map(t=>`<option value="t:${esc(t.id)}">${esc(t.nom)}</option>`).join('')+'</optgroup>',
    sts().length?'<optgroup label="Sous-traitants">'+sts().map(t=>`<option value="t:${esc(t.id)}">${esc(t.nom)}</option>`).join('')+'</optgroup>':''].join('');
  const sel=$('#filtre');if(sel.dataset.sig!==o){sel.innerHTML=o;sel.dataset.sig=o;}
  const v=S.filtre.slice(2);if(S.filtre&&S.ready&&!(S.filtre[0]==='e'?eqById(v):teById(v)))S.filtre='';
  sel.value=S.filtre;
}
function drawWeekLabel(){const ws=S.weekStart;
  if(S.view==='heures'){const e=addDays(ws,6);$('#wl').innerHTML=`Heures semaine ${isoWeek(ws)}<small>du lundi ${fmtD(ws)} au dimanche ${fmtD(e)} ${e.getFullYear()}</small>`;}

function chip(i,day,opt){
  opt=opt||{};const n=diff(i.debut,i.fin)+1,k=diff(i.debut,day)+1;

  return `<button type="button" class="chip" data-inter="${esc(i.id)}" style="--c:${colorOf(i)}">${opt.q?`<span class="q">${esc(opt.q)}</span>`:''}<span class="t">${esc(chName(i))}</span>${i.travaux?`<span class="s">${esc(i.travaux)}</span>`:''}${opt.who&&who(i)?`<span class="s" style="color:var(--muted)">${esc(who(i))}</span>`:''}${meta||tag(i)?`<span class="m">${meta?`<span>${meta}</span>`:''}${tag(i)}</span>`:''}</button>`;
}
const sortDay=a=>a.sort((x,y)=>x.horaire.localeCompare(y.horaire)||x.debut.localeCompare(y.debut));
function needSetup(){if(!S.eq.length&&!S.te.length)return `<div class="empty">${S.owner?'Commence par créer tes équipes et tes techniciens dans l\'onglet Bureau.':'Le planning n\'est pas encore rempli.'}</div>`;return '';}

function drawSemaine(){
  const e0=needSetup();if(e0)return e0;
  const days=[0,1,2,3,4,5].map(k=>iso(addDays(S.weekStart,k)));
  let h='<div class="scroll"><div class="wk"><div class="hd"><div class="d">'+(S.mode==='equipes'?'Équipe':'Technicien')+'</div></div>';

  const f=S.filtre,fv=f.slice(2);

    return `<div class="cell ${d===S.today?'today':''}">${its.map(i=>chip(i,d,{who:S.mode==='equipes'})).join('')}${S.owner?`<button type="button" class="add" ${attrs} data-add-day="${d}" aria-label="Ajouter une intervention le ${fmtIso(d)}">+</button>`:''}</div>`;}).join('');
  if(S.mode==='equipes'){
    let eqs=S.eq.slice();if(f[0]==='e')eqs=eqs.filter(e=>e.id===fv);if(f[0]==='t'){const t=teById(fv);eqs=eqs.filter(e=>t&&e.id===t.equipeId);}
    if(!eqs.length)return '<div class="empty">Aucune équipe à afficher.</div>';
    eqs.forEach(e=>{const membres=techs().filter(t=>t.equipeId===e.id).map(t=>t.nom).join(', ');
      h+=`<div class="rn" style="--c:${col(e.couleur)}"><i></i><div><b>${esc(e.nom)}</b>${membres?`<span>${esc(membres)}</span>`:''}</div></div>`;

function drawAgenda(){

/* Planning des sous-traitants (bureau) */

  const cards=L.map(t=>{const md=S.docs.filter(d=>d.stId===t.id);const nv=md.filter(d=>!d.vuLe).length;const nx=S.I.filter(i=>assignedTo(i,t)&&i.fin>=S.today).sort((a,b)=>a.debut.localeCompare(b.debut))[0];
    return `<div class="stc"><button type="button" class="stc-b" data-st-open="${esc(t.id)}"><b>${esc(t.nom)}</b><span class="muted">${esc([t.poste,t.contact,t.tel].filter(Boolean).join(' · '))}</span>

  return top+drawSTgrid(L,f,fv);
}
function drawSTgrid(L,f,fv){
  const days=[0,1,2,3,4,5].map(k=>iso(addDays(S.weekStart,k)));
  const rows=(f[0]==='t'&&isSTid(fv))?L.filter(t=>t.id===fv):L;
  if(narrow()){let h='<div class="agenda">';
    days.forEach((d,k)=>{const its=sortDay(S.I.filter(i=>inDay(i,d)&&rows.some(t=>assignedTo(i,t))));
      h+=`<section class="agd ${d===S.today?'today':''}"><h3>${JOURS[k]} ${fmtD(parse(d))}${d===S.today?' <b class="st warn">Aujourd\'hui</b>':''}</h3>${its.length?its.map(i=>chip(i,d,{q:stNames(i)})).join(''):'<div class="none">Rien de prévu</div>'}</section>`;});
    return h+'</div>';}
  let h='<div class="scroll"><div class="wk"><div class="hd"><div class="d">Sous-traitant</div></div>';
  days.forEach((d,k)=>{const dd=parse(d);h+=`<div class="hd ${d===S.today?'today':''}"><div class="d">${JOURS[k]}</div><div class="n">${dd.getDate()} <span>${MOIS[dd.getMonth()]}</span></div></div>`;});
  rows.forEach(t=>{h+=`<div class="rn" style="--c:${ST_COL}"><i></i><div><b>${esc(t.nom)}</b>${t.poste?`<span>${esc(t.poste)}</span>`:''}</div></div>`;
    h+=days.map(d=>{const its=sortDay(S.I.filter(i=>inDay(i,d)&&assignedTo(i,t)));
      return `<div class="cell ${d===S.today?'today':''}">${its.map(i=>chip(i,d,{})).join('')}<button type="button" class="add" data-add-tech="${esc(t.id)}" data-add-day="${d}" aria-label="Ajouter une intervention le ${fmtIso(d)}">+</button></div>`;}).join('');});
  return h+'</div></div>';
}

/* Mon planning */
function mine(){const t=myTech();return t?S.I.filter(i=>assignedTo(i,t)):[];}
const myRap=(i,me)=>i.rapports.filter(r=>r.techId===me.id);
function aFaire(){const me=myTech();if(!me)return [];const lim=iso(addDays(parse(S.today),-30));
  return mine().filter(i=>i.fin<S.today&&i.fin>=lim&&!myRap(i,me).length&&i.statut!=='Fait').sort((a,b)=>a.fin.localeCompare(b.fin));}

  const nDocs=S.docs.filter(d=>d.chantierId===i.chantierId&&!d.stId).length;

    ${i.travaux?`<div class="tr">${esc(i.travaux)}</div>`:''}
    <div class="info">${c.adresse?`<div><span>Adresse :</span> ${esc(c.adresse)}</div>`:''}${c.contact?`<div><span>Contact :</span> ${esc(c.contact)}</div>`:''}${others.length?`<div><span>Avec :</span> ${esc(others.map(t=>t.nom+(t.tel?' ('+t.tel+')':'')).join(', '))}</div>`:''}${stTxt?`<div><span>Sous-traitant :</span> ${esc(stTxt)}</div>`:''}${h?`<div><span>Mes heures ici :</span> <b>${fmtH(h)}</b> (${mr.length} rapport${mr.length>1?'s':''})</div>`:''}</div>
    ${i.consignes?`<p class="cons">${esc(i.consignes)}</p>`:''}

function drawMoi(){
  const t=myTech();const all=mine();
  const late=aFaire();
  const today=all.filter(i=>inDay(i,S.today));
  const lim=iso(addDays(parse(S.today),14));
  const next=all.filter(i=>i.debut>S.today&&i.debut<=lim).sort((a,b)=>a.debut.localeCompare(b.debut));
  const w0=iso(monday(parse(S.today))),w1=iso(addDays(parse(w0),6));
  const mineR=S.R.filter(r=>r.techId===t.id);
  const hw=mineR.filter(r=>r.date>=w0&&r.date<=w1).reduce((s,r)=>s+r.heures,0);
  const m0=S.today.slice(0,7);const hm=mineR.filter(r=>r.date.slice(0,7)===m0).reduce((s,r)=>s+r.heures,0);
  let h=isST(t)?`<p class="hello">Bonjour ${esc(t.contact||t.nom)}</p><p class="sub">${esc(t.nom)}${t.poste?' · '+esc(t.poste):''}</p>`
   :`<p class="hello">Bonjour ${esc(t.prenom||t.nom)}</p><p class="sub">${esc(eqName(t.equipeId))}${t.poste?' · '+esc(t.poste):''}</p>
   <div class="myh"><div><b>${fmtH(hw)}</b><span>mes heures cette semaine</span></div><div><b>${fmtH(hm)}</b><span>mes heures ce mois-ci</span></div></div>`;
  if(isST(t)){const md=S.docs.filter(d=>d.stId===t.id).sort((a,b)=>String(b.le).localeCompare(String(a.le)));const nv=md.filter(d=>!d.vuLe).length;
    if(md.length)h+=`<div class="sec">Mes documents (contrats, OS)${nv?` <b class="st warn">${nv} nouveau${nv>1?'x':''}</b>`:''}</div><div class="box"><div class="docs">${md.map(docHtml).join('')}</div></div>`;}
  if(late.length)h+=`<div class="sec">Rapports à faire <b class="st warn">${late.length}</b></div><div class="cards">${late.map(card).join('')}</div>`;
  h+=`<div class="sec">Aujourd'hui · ${fmtIso(S.today)}</div>`+(today.length?`<div class="cards">${today.map(card).join('')}</div>`:'<div class="empty">Rien de prévu aujourd\'hui.</div>');

  return h;
}

/* Chantiers : liste rangée, puis page du chantier */

  S.docs.filter(d=>d.chantierId===cid&&!d.stId).forEach(d=>ev.push({t:d.le,txt:'Document ajouté : '+(d.titre||d.type)}));
  ev.sort((a,b)=>String(b.t).localeCompare(String(a.t)));return ev;}

/* Gantt */
function drawGantt(){
  if(!S.ch.length)return `<div class="empty">Aucun chantier pour l'instant.</div>`;
  const start=S.weekStart,sI=iso(start),eI=iso(addDays(start,NJ-1));
  const inR=(a,b)=>isIso(a)&&isIso(b)&&a<=eI&&b>=sI;const cl=n=>Math.max(0,Math.min(NJ-1,n));
  let rows=S.ch.map(c=>({c,its:S.I.filter(i=>i.chantierId===c.id&&inR(i.debut,i.fin)&&passFiltre(i))}))
    .filter(r=>r.its.length||(!S.filtre&&r.c.statut!=='Terminé'&&inR(r.c.debut,r.c.fin)));
  rows.sort((a,b)=>(ST_ORD[a.c.statut]??1)-(ST_ORD[b.c.statut]??1)||(a.c.debut||'').localeCompare(b.c.debut||''));
  const legend=`<div class="legend">${S.eq.map(e=>`<span style="--c:${col(e.couleur)}"><i></i>${esc(e.nom)}</span>`).join('')}${S.I.some(hasST)?`<span style="--c:${ST_COL}"><i></i>Sous-traitants</span>`:''}<span><i class="band"></i>Période prévue</span><span><b class="st warn">contour orange</b> à pointer</span></div>`;
  if(!rows.length)return legend+'<div class="empty">Rien de planifié sur ces 6 semaines.</div>';
  let head='<div class="gt-row gt-head"><div class="gt-name">Chantier</div><div class="gt-track">';
  for(let w=0;w<6;w++){const d=addDays(start,w*7);head+=`<div class="gt-wk" style="left:calc(${w*7} * var(--cw))">S${isoWeek(d)} · ${fmtD(d)}</div>`;}
  for(let k=0;k<NJ;k++){const d=addDays(start,k);head+=`<div class="gt-dn ${(d.getDay()+6)%7>4?'we':''} ${iso(d)===S.today?'now':''}" style="left:calc(${k} * var(--cw))">${d.getDate()}</div>`;}
  head+='</div></div>';
  let over='';for(let k=0;k<NJ;k++){if((addDays(start,k).getDay()+6)%7>4)over+=`<div class="gt-we" style="left:calc(var(--name) + ${k} * var(--cw))"></div>`;}
  const tk=diff(sI,S.today);if(tk>=0&&tk<NJ)over+=`<div class="gt-now" style="left:calc(var(--name) + ${tk} * var(--cw) + var(--cw) / 2 - 1px)"></div>`;
  let body='';
  rows.forEach(r=>{const c=r.c;const all=S.I.filter(i=>i.chantierId===c.id);const done=all.filter(i=>i.statut==='Fait').length;
    const lanes=[],lane=new Map();r.its.slice().sort((a,b)=>a.debut.localeCompare(b.debut)).forEach(i=>{let k=lanes.findIndex(end=>end<i.debut);if(k<0){k=lanes.length;lanes.push(i.fin);}else lanes[k]=i.fin;lane.set(i.id,k);});
    const hgt=Math.max(64,Math.max(1,lanes.length)*26+14);let tr='';
    if(inR(c.debut,c.fin)){const a=cl(diff(sI,c.debut)),b=cl(diff(sI,c.fin));tr+=`<div class="gt-band" style="left:calc(${a} * var(--cw) + 1px);width:calc(${b-a+1} * var(--cw) - 3px)"></div>`;}
    r.its.forEach(i=>{const a=cl(diff(sI,i.debut)),b=cl(diff(sI,i.fin));const e=etat(i);const lbl=(e==='fait'?'✓ ':'')+(stOnly(i)?stNames(i)+' · ':'')+(i.travaux||eqName(teamOf(i)));
      tr+=`<button type="button" class="gt-bar ${e==='fait'?'done':''} ${e==='apointer'?'late':''} ${e==='probleme'?'bad':''}" data-inter="${esc(i.id)}" title="${esc(eqName(teamOf(i))+' : '+(i.travaux||''))}" style="--c:${colorOf(i)};top:${7+lane.get(i.id)*26}px;left:calc(${a} * var(--cw) + 2px);width:calc(${b-a+1} * var(--cw) - 4px)">${esc(lbl)}</button>`;});
    body+=`<div class="gt-row" style="min-height:${hgt}px"><div class="gt-name"><button type="button" class="linkish" data-chantier="${esc(c.id)}" style="color:var(--ink);font-weight:700;font-size:13.5px;line-height:1.25">${esc(c.nom)}</button><span>${esc([c.client,c.adresse].filter(Boolean).join(' · '))}</span>${all.length?`<span>${done}/${all.length} faites</span><div class="pg"><u style="width:${Math.round(done/all.length*100)}%"></u></div>`:''}</div><div class="gt-track">${tr}</div></div>`;});
  return legend+`<div class="scroll"><div class="gt" style="--n:${NJ}">${head}<div style="position:relative">${over}${body}</div></div></div>`;
}

/* Bureau */
let nameReq=new Set();
function resolveNames(ids){
  const miss=ids.filter(id=>id&&!(id in S.names)&&!nameReq.has(id));if(!miss.length||!S.user||!S.user.profiles)return;
  miss.forEach(id=>nameReq.add(id));
  S.user.profiles(miss).then(ps=>{miss.forEach(id=>{S.names[id]=(ps&&ps[id]&&ps[id].name)||'';});render();}).catch(()=>{});
}

async function compress(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url;});
    const M=1600;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,M/Math.max(w,h));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    const b=await new Promise(res=>c.toBlob(res,'image/jpeg',0.8));
    return b||file;
  }catch(e){return ['image/jpeg','image/png','image/webp'].indexOf(file.type)>=0?file:null;}
  finally{URL.revokeObjectURL(url);}
}

    if(mailPris(o.mail,'',a?a.id:''))return 'Cette adresse mail est déjà utilisée.';
    const ok=await write(a?coll('acces').doc(a.id):coll('acces').doc(),o,'plan');if(ok)toast(a?'Accès modifié.':'Accès ajouté.');return ok?true:undefined;},
  {extra:a?'<button type="button" class="btn danger" id="delA">Retirer l\'accès</button>':'',onReady:f=>{const b=f.querySelector('#delA');if(b)b.onclick=()=>confirmBox('Retirer l\'accès',`Retirer l'accès bureau de <b>${esc(a.nom)}</b> ? Ses appareils seront déconnectés.`,'Retirer',async()=>{await write(coll('acces').doc(a.id),null,'plan');});}});
}
function telCell(t){const ap=(S.app||[]).find(a=>a.techId===t.id);
  if(!ap&&(S.dem||[]).some(a=>a.techId===t.id))return '<b>Demande de connexion en attente</b> (à valider en bas de l\'écran)';
  if(!ap)return t.tel||t.mail?'Pas encore connecté':'Ajoute son numéro pour qu\'il puisse se connecter';
  const d=ap.le?new Date(ap.le):null;
  return `Téléphone relié${ap.modele?' ('+esc(ap.modele)+')':''}${d&&!isNaN(d)?' le '+d.toLocaleDateString('fr-FR'):''} <button type="button" class="btn" style="padding:2px 9px;font-size:12px;margin-left:4px" data-liberer="${esc(ap.id)}">Libérer</button>`;}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-liberer]');if(!b)return;ev.stopPropagation();ev.preventDefault();
  const ap=(S.app||[]).find(a=>a.id===b.dataset.liberer);if(!ap)return;const t=teById(ap.techId);
  confirmBox('Libérer le téléphone',`Libérer le téléphone de <b>${esc(t?t.nom:'ce technicien')}</b> ? Il sera déconnecté et pourra se connecter sur un nouveau téléphone.`,'Libérer',async()=>{await write(S.db.doc('appareils/'+ap.id),null,'plan');toast('Téléphone libéré.');});},true);
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-new-acces],[data-edit-acces]');if(!t)return;
  if(t.hasAttribute('data-new-acces'))accesForm(null);else{const a=(S.acces||[]).find(x=>x.id===t.dataset.editAcces);if(a)accesForm(a);}});

/* ---------- Identification ---------- */
function identite(first){
  const ts=techs();const taken=new Set(Object.keys(S.liens).filter(u=>u!==S.uid).map(u=>S.liens[u]));
  const groups=S.eq.map(e=>({e,ts:ts.filter(t=>t.equipeId===e.id)})).filter(g=>g.ts.length);
  const sans=ts.filter(t=>!eqById(t.equipeId));
  const btn=t=>`<button type="button" data-moi="${esc(t.id)}" style="--c:${eqColor(t.equipeId)}">${esc(t.nom)}<span>${taken.has(t.id)?'déjà relié à un compte':esc(t.poste||'')}</span></button>`;
  modal(first?'Bienvenue sur le planning':'Qui es-tu ?',`
   <p style="margin:0;color:var(--muted)">Choisis ton nom pour voir ton planning et pointer tes interventions. Ce choix est relié à ton adresse mail.</p>
   ${groups.map(g=>`<div class="sec" style="margin:6px 0 0"><span class="dot" style="--c:${col(g.e.couleur)}"></span>${esc(g.e.nom)}</div><div class="pick">${g.ts.map(btn).join('')}</div>`).join('')}
   ${sans.length?`<div class="sec" style="margin:6px 0 0">Sans équipe</div><div class="pick">${sans.map(btn).join('')}</div>`:''}
   ${!ts.length?'<p class="muted" style="margin:0">Aucun technicien n\'est encore enregistré.</p>':''}
   <div class="row" style="justify-content:flex-end;margin-top:6px"><button type="button" class="btn" data-moi="__visiteur">Juste consulter</button></div>`,
  async()=>true,{noActions:true});
}
async function pickMe(id){
  if(id==='__visiteur'){ls.set('atlas-visiteur','1');closeModal();render();return;}
  if(!S.uid){toast('Connecte-toi avec ton adresse mail.');return;}
  const ok=await write(S.db.doc('liens/'+S.uid),{techId:id,le:new Date().toISOString()},'lien');
  if(ok){closeModal();S.view='moi';S.liens[S.uid]=id;render();toast('C\'est noté.');}
}

/* ---------- Événements ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-close],[data-view],[data-inter],[data-photo],[data-chantier],[data-new-rap],[data-edit-rap],[data-moi],[data-add-day],[data-edit-eq],[data-edit-tech],[data-edit-ch],[data-new-eq],[data-new-ch],[data-new-tech],[data-edit-inter],[data-del-inter],[data-mode],[data-hcell],[data-val],[data-unval],[data-export],#delEx,[data-new-st],[data-edit-st],[data-doc-open],[data-doc-del],[data-doc-add],[data-chback],[data-calm],[data-add-ch],[data-st-open],[data-stdoc-add],[data-stvis]');
  if(!t)return;
  if(t.hasAttribute('data-close')){if(t.closest('#modal'))closeModal();else closeDrawer();return;}
  if(t.dataset.view){S.view=t.dataset.view;if(S.view==='chantiers')S.chantier='';closeDrawer();render();window.scrollTo(0,0);return;}
  if(t.hasAttribute('data-chback')){S.chantier='';render();window.scrollTo(0,0);return;}
  if(t.dataset.calm!==undefined){const k=Number(t.dataset.calm);const c=chById(S.chantier);S.calM=k===0?new Date(parse(S.today).getFullYear(),parse(S.today).getMonth(),1):new Date(S.calM.getFullYear(),S.calM.getMonth()+k,1);if(!k&&!c)S.calM=null;render();return;}
  if(t.dataset.mode){S.mode=t.dataset.mode;ls.set('atlas-mode',S.mode);render();return;}
  if(t.dataset.photo){lightbox(t.dataset.photo);return;}
  if(t.dataset.inter){openDrawer(t.dataset.inter);return;}
  if(t.dataset.chantier){ouvrirChantier(t.dataset.chantier);return;}
  if(t.dataset.newRap){const i=S.I.find(x=>x.id===t.dataset.newRap);closeDrawer();rapportForm(i,null);return;}
  if(t.dataset.editRap){const r=findRap(t.dataset.editRap);if(!r)return;const i=S.I.find(x=>x.id===r.interventionId);closeDrawer();
    if(!i){toast('L\'intervention de ce rapport a été supprimée.');return;}rapportForm(i,r);return;}
  if(t.dataset.moi){pickMe(t.dataset.moi);return;}
  if(t.dataset.docAdd){closeDrawer();docForm(t.dataset.docAdd);return;}
  if(t.dataset.docOpen){const d=S.docs.find(x=>x.id===t.dataset.docOpen);if(d&&window.__atlasDoc){window.__atlasDoc.ouvrir(d.fichier,d.nom,d.mime);if(d.stId&&!d.vuLe&&meST())window.__atlasDoc.vu(d.id);}return;}
  if(t.dataset.docDel){const d=S.docs.find(x=>x.id===t.dataset.docDel);if(!d)return;const cid=d.chantierId;closeDrawer();
    confirmBox('Supprimer le document',`Supprimer « ${esc(d.titre||d.type)} » ?`,'Supprimer',async()=>{if(await write(coll('documents').doc(d.id),null,'doc')){if(window.__atlasDoc)window.__atlasDoc.remove(d.fichier);toast('Document supprimé.');if(d.stId)openST(d.stId);else if(!views().some(v=>v[0]==='chantiers'))openChantier(cid);}});return;}
  if(!S.owner||!S.db)return;
  if(t.hasAttribute('data-new-st')){stForm(null);return;}
  if(t.dataset.addCh){interForm(null,{chantierId:t.dataset.addCh,date:S.today});return;}
  if(t.dataset.stOpen){openST(t.dataset.stOpen);return;}
  if(t.dataset.stdocAdd){closeDrawer();stDocForm(t.dataset.stdocAdd);return;}
  if(t.hasAttribute('data-stvis')){const on=!(S.reg&&S.reg.stVisibles===true);write(coll('reglages').doc('general'),Object.assign({},S.reg,{stVisibles:on}),'plan').then(ok=>{if(ok)toast(on?'Tes salariés voient maintenant les sous-traitants prévus sur leurs chantiers.':'Les sous-traitants sont cachés à tes salariés.');});return;}

  if(t.id==='delEx'){deleteExamples();return;}
  if(t.dataset.addDay){interForm(null,{date:t.dataset.addDay,equipeId:t.dataset.addEq||'',techId:t.dataset.addTech||''});return;}
  if(t.dataset.editEq){equipeForm(eqById(t.dataset.editEq));return;}
  if(t.dataset.editTech){techForm(teById(t.dataset.editTech));return;}
  if(t.dataset.editCh){closeDrawer();chantierForm(chById(t.dataset.editCh));return;}
  if(t.dataset.editSt){closeDrawer();stForm(teById(t.dataset.editSt));return;}
  if(t.dataset.hcell){const p=t.dataset.hcell.split('|');const tt=teById(p[0]);const rs=S.R.filter(r=>r.techId===p[0]&&r.date===p[1]);
    showDrawer(tt?eqColor(tt.equipeId):GREY,(tt?tt.nom:'')+' · '+fmtIso(p[1]),fmtH(rs.reduce((s,r)=>s+r.heures,0)),`<div class="rps">${rs.map(r=>rapHtml(r,{ch:true,travaux:(S.I.find(i=>i.id===r.interventionId)||{}).travaux})).join('')}</div>`);return;}
  if(t.dataset.val){setValid(t.dataset.val,true);return;}
  if(t.dataset.unval){setValid(t.dataset.unval,false);return;}
  if(t.dataset.export){exportCsv(t.dataset.export);return;}
  if(t.hasAttribute('data-new-eq')){equipeForm(null);return;}
  if(t.hasAttribute('data-new-ch')){chantierForm(null);return;}
  if(t.hasAttribute('data-new-tech')){techForm(null);return;}
  if(t.dataset.editInter){const i=S.I.find(x=>x.id===t.dataset.editInter);closeDrawer();if(i)interForm(i);return;}
  if(t.dataset.delInter){const i=S.I.find(x=>x.id===t.dataset.delInter);if(!i)return;closeDrawer();
    confirmBox('Supprimer l\'intervention',`Supprimer « ${esc(i.travaux||chName(i))} » du ${fmtIso(i.debut)} ?`,'Supprimer',async()=>{window.__atlasNotif=true;await write(coll('interventions').doc(i.id),null,'plan');if(S.pt[i.id])await write(S.db.doc('pointages/'+i.id),null,'plan');toast('Intervention supprimée.');});}
});
document.addEventListener('error',ev=>{const im=ev.target;if(im&&im.tagName==='IMG'){const th=im.closest('.th');if(th&&!th.classList.contains('miss')){th.classList.add('miss');th.textContent='Photo indisponible';}}},true);
document.addEventListener('keydown',ev=>{const lb=document.querySelector('.lightbox');if(ev.key==='Escape'&&lb){lb.remove();return;}if(ev.key==='Escape'){if(!$('#modal').hidden)closeModal();else if(!$('#drawer').hidden)closeDrawer();}});
$('#who').onclick=()=>{};
$('#prev').onclick=()=>{S.weekStart=addDays(S.weekStart,-7);render();};
$('#next').onclick=()=>{S.weekStart=addDays(S.weekStart,7);render();};
$('#thisweek').onclick=()=>{S.weekStart=monday(new Date());render();};
document.addEventListener('input',ev=>{if(ev.target&&ev.target.id==='chq'){S.qch=ev.target.value;filtrerChantiers();}});
$('#filtre').onchange=e=>{S.filtre=e.target.value;ls.set('atlas-filtre',S.filtre);render();};
$('#addInter').onclick=()=>{if(S.owner&&S.db)interForm(null);};
if(mq.addEventListener)mq.addEventListener('change',render);
setInterval(()=>{const t=iso(new Date());if(t!==S.today){S.today=t;recompute();render();}},60000);

/* ---------- Connexion aux données partagées ---------- */
async function start(){
  const C=window.claude;
  if(!C||typeof C.use!=='function'){S.ready=true;render();return;}
  let db=null,user=null;
  try{[db,user]=await Promise.all([C.use('db'),C.use('user')]);}catch(e){}
  try{S.assets=await C.use('assets');}catch(e){S.assets=null;}
  try{S.dl=await C.use('downloads');}catch(e){S.dl=null;}
  S.user=user||null;
  if(user){try{S.owner=!!(await user.isOwner());}catch(e){}
    try{const c=await user.can('data.write');S.canWrite=(c===null||c===undefined)?null:!!c;}catch(e){}
    try{S.uid=await user.id();}catch(e){}}
  if(!db){S.ready=true;render();return;}
  S.db=db;
  const got={};const need=['equipes','techniciens','chantiers','interventions','pointages','liens','validations'];
  const timer=setTimeout(()=>{setNotice('load','Les données du planning ne répondent pas encore. Vérifie ta connexion : la page se met à jour toute seule.');if(!S.ready){S.ready=true;render();}},10000);
  const done=()=>{if(S.ready&&!S.asked&&!S.owner&&need.every(k=>got[k])){S.asked=true;if(!myTech()&&!ls.get('atlas-visiteur')&&S.te.length)identite(true);}};
  const sub=(name,fn)=>db.collection(name).onSnapshot(snap=>{
      fn(snap.docs.filter(d=>d.exists).map(d=>Object.assign({},d.data(),{id:d.id})));
      got[name]=true;
      if(need.every(k=>got[k])){if(!snap.metadata.fromCache){clearTimeout(timer);setNotice('load',null);}S.ready=true;}
      recompute();render();done();
    },err=>{clearTimeout(timer);setNotice('load',`Le planning n'a pas pu être chargé (${esc(err&&err.code||'erreur')}). Recharge la page un peu plus tard.`);S.ready=true;render();});
  const byOrdre=(a,b)=>(a.ordre||0)-(b.ordre||0)||String(a.nom).localeCompare(String(b.nom));
  sub('equipes',a=>{S.eq=a.filter(e=>str(e.nom)).map(e=>Object.assign({code:'',chef:'',remarques:''},e)).sort(byOrdre);});
  sub('techniciens',a=>{S.te=a.filter(t=>str(t.nom)).map(t=>Object.assign({prenom:'',nomFamille:'',equipeId:'',poste:'',tel:'',habil:'',vehicule:'',remarques:'',mail:''},t)).sort(byOrdre);});
  sub('chantiers',a=>{S.ch=a.filter(c=>str(c.nom)).map(c=>Object.assign({client:'',adresse:'',contact:'',debut:'',fin:'',statut:'À venir',remarques:''},c));});
  sub('interventions',a=>{S.it=a;});
  sub('pointages',a=>{const m={};a.forEach(p=>{m[p.id]=p;});S.pt=m;});
  sub('liens',a=>{const m={};a.forEach(l=>{if(typeof l.techId==='string'&&l.techId)m[l.id]=l.techId;});S.liens=m;S.lienKeys=a.map(l=>l.id);syncRapports();});
  sub('acces',a=>{S.acces=a.filter(x=>str(x.mail));});
  sub('appareils',a=>{S.app=a;});
  sub('demandes',a=>{S.dem=a;});
  sub('validations',a=>{const m={};a.forEach(x=>{if(x.valide)m[x.id]=true;});S.val=m;});
  sub('documents',a=>{S.docs=a.filter(d=>str(d.fichier)&&(str(d.chantierId)||str(d.stId)));});
  sub('reglages',a=>{S.reg=a.find(x=>x.id==='general')||{};});
  syncRapports();
}
function syncRapports(){
  if(!S.db)return;
  const uids=S.lienKeys.concat(S.uid?[S.uid]:[]).filter((u,k,arr)=>okId(u)&&arr.indexOf(u)===k);
  uids.forEach(uid=>{if(S.rsubs[uid])return;S.rsubs[uid]=true;
    try{S.db.collection('rapports/'+uid+'/r').onSnapshot(snap=>{S.rp[uid]=snap.docs.filter(d=>d.exists).map(d=>Object.assign({},d.data(),{id:d.id}));recompute();render();},()=>{});}catch(e){}
  });
}
drawWeekLabel();
start();
})();
